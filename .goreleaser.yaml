# terminu family template (harness project/goreleaser.yaml), copied to an app's
# .goreleaser.yaml. Replace ccdrawu with the app's name and fill the lines
# marked "app:". An app with a Windows build uncomments the lines marked
# "Windows"; nothing else changes.
version: 2

project_name: ccdrawu

builds:
  - main: ./cmd/ccdrawu
    binary: ccdrawu
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # internal/version.Version takes the tag without its v; the app prints
      # it with the v (internal/version.Display). ModulePath is go.mod's
      # module, its /vN included from v2 on.
      - -s -w -X {{ .ModulePath }}/internal/version.Version={{.Version}}
    goos:
      # unix-first: no Windows build unless the app needs one.
      - linux
      - darwin
      - windows   # Windows
    goarch:
      - amd64
      - arm64
    # app: the os/arch pairs this app cannot build, each as
    #   - goos: linux
    #     goarch: arm64
    # or none.
    ignore: []

archives:
  - formats:
      - tar.gz
    format_overrides:   # Windows
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# The release notes come from CHANGELOG.md (.github/workflows/release.yml).
changelog:
  disable: true

# The versions here carry a pre-release part (1.4.3-cn.3), which GitHub would
# mark as a pre-release — and `releases/latest`, which the install scripts and
# `ccdrawu update` read, points at the newest stable release only. So this
# fork's releases are published as stable.
release:
  prerelease: false

# This fork has no Homebrew tap and no Scoop bucket: publishing to them
# would fail, since those repositories do not exist. The GitHub Release
# itself — the archives and the checksums the install scripts read — is
# what matters here.
